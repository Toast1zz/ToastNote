name: ToastNote
options:
  bundleIdPrefix: app.toastnote
  developmentLanguage: zh-Hans
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  ToastNoteKit:
    path: Packages/ToastNoteKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
targets:
  ToastNote:
    type: application
    platform: macOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        CFBundleName: ToastNote
        CFBundleDisplayName: ToastNote
        # The interface is Chinese; this also localizes the system-provided menus (File, Edit, Window...).
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        SUFeedURL: "https://github.com/$(GITHUB_REPOSITORY)/releases/latest/download/appcast.xml"
        SUPublicEDKey: "$(SPARKLE_PUBLIC_KEY)"
        SUEnableAutomaticChecks: true
        NSHumanReadableCopyright: "MIT License"
    entitlements:
      path: App/ToastNote.entitlements   # empty dict: no sandbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.toastnote.mac
        # Set by the release workflow (github.repository). The owner here is a placeholder for local builds.
        GITHUB_REPOSITORY: OWNER/ToastNote
        # EdDSA public key from Sparkle's generate_keys; empty disables updates (see docs/RELEASING.md).
        SPARKLE_PUBLIC_KEY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - { package: ToastNoteKit, product: VaultKit }
      - { package: ToastNoteKit, product: EditorKit }
      - { package: ToastNoteKit, product: AIFormatKit }
      - { package: ToastNoteKit, product: IndexKit }
      - { package: ToastNoteKit, product: ExportKit }
      - { package: Sparkle, product: Sparkle }
